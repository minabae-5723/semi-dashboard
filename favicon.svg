<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="wafer"><path d="M8.8 28 A14 14 0 1 1 23.2 28 Z"/></clipPath>
    <!-- iridescent wafer sheen -->
    <linearGradient id="sheen" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0"    stop-color="#00d4ff"/>
      <stop offset="0.22" stop-color="#4d7cff"/>
      <stop offset="0.42" stop-color="#a259ff"/>
      <stop offset="0.6"  stop-color="#ff5ac8"/>
      <stop offset="0.78" stop-color="#ff8a3d"/>
      <stop offset="1"    stop-color="#ffd84d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- silicon disc with bottom flat -->
  <path d="M8.8 28 A14 14 0 1 1 23.2 28 Z" fill="url(#sheen)"/>
  <!-- die grid -->
  <g clip-path="url(#wafer)" stroke="#ffffff" stroke-width="0.9" opacity="0.35">
    <path d="M6 2V30 M11 2V30 M16 2V30 M21 2V30 M26 2V30 M2 6H30 M2 11H30 M2 16H30 M2 21H30 M2 26H30"/>
  </g>
  <!-- specular highlight -->
  <path d="M8.8 28 A14 14 0 1 1 23.2 28 Z" fill="url(#glow)" clip-path="url(#wafer)"/>
  <!-- rim -->
  <path d="M8.8 28 A14 14 0 1 1 23.2 28 Z" fill="none" stroke="#2a2350" stroke-width="1.4"/>
</svg>
